<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .val { text-anchor: middle; font-family: Consolas, monospace; font-size: 15px; }
    .dim { opacity: 0.25; }
    .found { fill: #55aea6; }
    .found text { fill: #fff; }
    .rng { stroke: #e67e22; stroke-width: 2.5; fill: none; }
    .step { fill: #3d8d86; font-weight: bold; font-size: 14px; }
    .note { fill: #999; font-size: 13px; }
  </style>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f5f5f5"/>

  <text x="360" y="36" text-anchor="middle" font-weight="bold">在有序数组中查找 23（下标 0~7）</text>

  <text class="step" x="55" y="90">第 1 步</text>
  <g>
    <rect class="cell" x="120" y="60" width="64" height="46"/>
    <rect class="cell" x="190" y="60" width="64" height="46"/>
    <rect class="cell" x="260" y="60" width="64" height="46"/>
    <rect class="cell" x="330" y="60" width="64" height="46"/>
    <rect class="cell" x="400" y="60" width="64" height="46"/>
    <rect class="cell" x="470" y="60" width="64" height="46"/>
    <rect class="cell" x="540" y="60" width="64" height="46"/>
    <rect class="cell" x="610" y="60" width="64" height="46"/>
    <text class="val" x="152" y="90">3</text>
    <text class="val" x="222" y="90">7</text>
    <text class="val" x="292" y="90">11</text>
    <text class="val" x="362" y="90">15</text>
    <text class="val" x="432" y="90">19</text>
    <text class="val" x="502" y="90">23</text>
    <text class="val" x="572" y="90">27</text>
    <text class="val" x="642" y="90">31</text>
    <rect class="rng" x="116" y="56" width="562" height="54" rx="4"/>
  </g>
  <text class="note" x="400" y="128" text-anchor="middle">范围 [0,7]，中位下标 3 的值是 15：15 &lt; 23 → 目标在右半边</text>

  <text class="step" x="55" y="205">第 2 步</text>
  <g>
    <g class="dim">
      <rect class="cell" x="120" y="175" width="64" height="46"/>
      <rect class="cell" x="190" y="175" width="64" height="46"/>
      <rect class="cell" x="260" y="175" width="64" height="46"/>
      <rect class="cell" x="330" y="175" width="64" height="46"/>
      <text class="val" x="152" y="205">3</text>
      <text class="val" x="222" y="205">7</text>
      <text class="val" x="292" y="205">11</text>
      <text class="val" x="362" y="205">15</text>
    </g>
    <rect class="cell" x="400" y="175" width="64" height="46"/>
    <rect class="found" x="470" y="175" width="64" height="46"/>
    <rect class="cell" x="540" y="175" width="64" height="46"/>
    <rect class="cell" x="610" y="175" width="64" height="46"/>
    <text class="val" x="432" y="205">19</text>
    <text class="val" x="502" y="205">23</text>
    <text class="val" x="572" y="205">27</text>
    <text class="val" x="642" y="205">31</text>
    <rect class="rng" x="396" y="171" width="282" height="54" rx="4"/>
  </g>
  <text class="note" x="400" y="248" text-anchor="middle">范围缩到 [4,7]，中位下标 5 的值正好是 23 → 找到！</text>

  <text class="note" x="360" y="284" text-anchor="middle">每次范围减半：8 → 4 → 2 → 1，最多看 log₂n 个元素。100 万个数只要 20 次！</text>
</svg>
