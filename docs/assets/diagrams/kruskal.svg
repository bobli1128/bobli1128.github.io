<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .node { fill: #fff; stroke: #55aea6; stroke-width: 2; }
    .node text { text-anchor: middle; font-family: Consolas, monospace; font-size: 15px; }
    .mst { stroke: #55aea6; stroke-width: 2.5; }
    .skip { stroke: #ccc; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .w { fill: #3d8d86; font-size: 13px; font-weight: bold; }
    .skipw { fill: #bbb; font-size: 13px; }
    .note { fill: #999; font-size: 13px; }
    .lbl { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
    .cut { fill: #e67e22; font-size: 13px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f5f5f5"/>

  <text x="360" y="34" text-anchor="middle" font-weight="bold">Kruskal：边从短到长排队，能用就要（成环的跳过）</text>

  <circle class="node" cx="110" cy="110" r="24"/>
  <text x="110" y="116">1</text>
  <circle class="node" cx="300" cy="110" r="24"/>
  <text x="300" y="116">2</text>
  <circle class="node" cx="490" cy="110" r="24"/>
  <text x="490" y="116">3</text>
  <circle class="node" cx="300" cy="240" r="24"/>
  <text x="300" y="246">4</text>

  <line class="mst" x1="134" y1="110" x2="276" y2="110"/>
  <text class="w" x="205" y="100" text-anchor="middle">1 ✅第1条</text>
  <line class="mst" x1="300" y1="134" x2="300" y2="216"/>
  <text class="w" x="318" y="180">2 ✅第2条</text>
  <line class="mst" x1="130" y1="120" x2="282" y2="230"/>
  <text class="w" x="178" y="196" text-anchor="middle">3 ✅第3条</text>

  <line class="skip" x1="324" y1="110" x2="466" y2="110"/>
  <text class="skipw" x="395" y="100" text-anchor="middle">4</text>
  <line class="skip" x1="312" y1="118" x2="478" y2="102"/>
  <text class="skipw" x="400" y="140" text-anchor="middle">5</text>

  <text class="cut" x="470" y="70" text-anchor="middle">4、5 号边：两端已在同一棵树 → 会成环，跳过！</text>

  <text class="lbl" x="360" y="272" text-anchor="middle">选满 n-1 条边即得到最小生成树，总权 1+2+3 = 6</text>
</svg>
