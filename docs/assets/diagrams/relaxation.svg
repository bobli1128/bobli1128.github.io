<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e67e22"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .node { fill: #fff; stroke: #55aea6; stroke-width: 2; }
    .node text { text-anchor: middle; font-family: Consolas, monospace; font-size: 15px; }
    .dist { fill: #3d8d86; font-size: 13px; font-weight: bold; }
    .edge { stroke: #999; stroke-width: 1.6; }
    .w { fill: #3d8d86; font-size: 13px; font-weight: bold; }
    .flow { stroke: #e67e22; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .note { fill: #999; font-size: 13px; }
    .big { font-family: Consolas, monospace; font-size: 15px; }
    .new { fill: #e67e22; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="280" rx="10" fill="#f5f5f5"/>

  <text x="360" y="34" text-anchor="middle" font-weight="bold">松弛（relaxation）：所有最短路算法的共同心脏</text>

  <circle class="node" cx="160" cy="130" r="30"/>
  <text x="160" y="136">u</text>
  <text class="dist" x="160" y="86" text-anchor="middle">dist[u] = 7</text>
  <circle class="node" cx="440" cy="130" r="30"/>
  <text x="440" y="136">v</text>
  <text class="dist" x="440" y="86" text-anchor="middle">dist[v] = 10</text>

  <line class="edge" x1="192" y1="118" x2="408" y2="118"/>
  <text class="w" x="300" y="108" text-anchor="middle">边权 w = 2</text>

  <text class="big" x="300" y="185" text-anchor="middle">试一试：7 + 2 = 9</text>
  <text class="new" x="300" y="212" text-anchor="middle">9 &lt; 10 → dist[v] 更新为 9</text>

  <text class="note" x="360" y="248" text-anchor="middle">「绕道 u 再到 v，会不会更近？」——每条边都这样试一遍；Dijkstra 靠优先队列挑顺序，SPFA 靠队列排班，Floyd 直接三重循环</text>
</svg>
