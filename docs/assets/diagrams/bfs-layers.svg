<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .dot { fill: #fff; stroke: #55aea6; stroke-width: 1.8; }
    .dot text { text-anchor: middle; font-family: Consolas, monospace; font-size: 13px; }
    .src { fill: #55aea6; }
    .src text { fill: #fff; }
    .ring { fill: none; stroke: #b7dcd8; stroke-width: 1.6; stroke-dasharray: 5 5; }
    .wave { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
    .note { fill: #999; font-size: 13px; }
  </style>
  <rect x="0" y="0" width="720" height="320" rx="10" fill="#f5f5f5"/>

  <text x="360" y="34" text-anchor="middle" font-weight="bold">BFS：像水波一样一圈圈扩散</text>

  <circle class="ring" cx="360" cy="170" r="70"/>
  <circle class="ring" cx="360" cy="170" r="125"/>

  <circle class="dot src" cx="360" cy="170" r="26"/>
  <text x="360" y="176">S</text>
  <text class="wave" x="360" y="215" text-anchor="middle">S: 距离 0</text>

  <circle class="dot" cx="295" cy="130" r="22"/>
  <text x="295" y="136">a</text>
  <circle class="dot" cx="425" cy="130" r="22"/>
  <text x="425" y="136">b</text>
  <text class="wave" x="295" y="98" text-anchor="middle">距离 1</text>
  <text class="wave" x="452" y="98" text-anchor="middle">距离 1</text>

  <circle class="dot" cx="245" cy="205" r="22"/>
  <text x="245" y="211">c</text>
  <circle class="dot" cx="475" cy="205" r="22"/>
  <text x="475" y="211">d</text>
  <circle class="dot" cx="360" cy="252" r="22"/>
  <text x="360" y="258">e</text>
  <text class="wave" x="196" y="180" text-anchor="middle">距离 2</text>
  <text class="wave" x="524" y="180" text-anchor="middle">距离 2</text>
  <text class="wave" x="360" y="292" text-anchor="middle">距离 2</text>

  <text class="note" x="360" y="312" text-anchor="middle">先处理完距离 1 的所有点，再处理距离 2 —— 队列保证了这个顺序；第一次碰到某点，距离就是最短距离</text>
</svg>
