<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.3; }
    .cell text { text-anchor: middle; font-family: Consolas, monospace; font-size: 14px; }
    .head { fill: #e0f2f0; stroke: #3d8d86; stroke-width: 1.3; }
    .head text { text-anchor: middle; font-family: Consolas, monospace; font-size: 14px; font-weight: bold; }
    .hl { fill: #ffe9c9; stroke: #e67e22; stroke-width: 1.8; }
    .note { fill: #999; font-size: 13px; }
    .lbl { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="320" rx="10" fill="#f5f5f5"/>

  <text x="360" y="32" text-anchor="middle" font-weight="bold">LCS 填表：f[i][j] = s₁ 前 i 个与 s₂ 前 j 个的公共子序列长度</text>

  <rect class="head" x="150" y="55" width="66" height="38"/>
  <text x="183" y="80">　</text>
  <rect class="head" x="216" y="55" width="66" height="38"/>
  <text x="249" y="80">B</text>
  <rect class="head" x="282" y="55" width="66" height="38"/>
  <text x="315" y="80">D</text>
  <rect class="head" x="348" y="55" width="66" height="38"/>
  <text x="381" y="80">C</text>
  <rect class="head" x="414" y="55" width="66" height="38"/>
  <text x="447" y="80">A</text>
  <rect class="head" x="480" y="55" width="66" height="38"/>
  <text x="513" y="80">B</text>
  <rect class="head" x="546" y="55" width="66" height="38"/>
  <text x="579" y="80">A</text>

  <rect class="head" x="150" y="93" width="66" height="38"/>
  <text x="183" y="118">A</text>
  <rect class="cell" x="216" y="93" width="66" height="38"/>
  <text x="249" y="118">0</text>
  <rect class="cell" x="282" y="93" width="66" height="38"/>
  <text x="315" y="118">0</text>
  <rect class="cell" x="348" y="93" width="66" height="38"/>
  <text x="381" y="118">0</text>
  <rect class="cell" x="414" y="93" width="66" height="38"/>
  <text x="447" y="118">1</text>
  <rect class="cell" x="480" y="93" width="66" height="38"/>
  <text x="513" y="118">1</text>
  <rect class="cell" x="546" y="93" width="66" height="38"/>
  <text x="579" y="118">1</text>

  <rect class="head" x="150" y="131" width="66" height="38"/>
  <text x="183" y="156">B</text>
  <rect class="cell" x="216" y="131" width="66" height="38"/>
  <text x="249" y="156">1</text>
  <rect class="cell" x="282" y="131" width="66" height="38"/>
  <text x="315" y="156">1</text>
  <rect class="cell" x="348" y="131" width="66" height="38"/>
  <text x="381" y="156">1</text>
  <rect class="cell" x="414" y="131" width="66" height="38"/>
  <text x="447" y="156">1</text>
  <rect class="hl" x="480" y="131" width="66" height="38"/>
  <text x="513" y="156">2</text>
  <rect class="cell" x="546" y="131" width="66" height="38"/>
  <text x="579" y="156">2</text>

  <rect class="head" x="150" y="169" width="66" height="38"/>
  <text x="183" y="194">C</text>
  <rect class="cell" x="216" y="169" width="66" height="38"/>
  <text x="249" y="194">1</text>
  <rect class="cell" x="282" y="169" width="66" height="38"/>
  <text x="315" y="194">1</text>
  <rect class="cell" x="348" y="169" width="66" height="38"/>
  <text x="381" y="194">2</text>
  <rect class="cell" x="414" y="169" width="66" height="38"/>
  <text x="447" y="194">2</text>
  <rect class="cell" x="480" y="169" width="66" height="38"/>
  <text x="513" y="194">2</text>
  <rect class="cell" x="546" y="169" width="66" height="38"/>
  <text x="579" y="194">2</text>

  <text class="lbl" x="640" y="156" text-anchor="end">字符相等：←↑ 加一</text>
  <text class="note" x="640" y="178" text-anchor="end">不等：取左、上较大值</text>

  <text class="note" x="360" y="248" text-anchor="middle">橙色格：s₁[i]=B=s₂[j]=B → f[i][j] = f[i-1][j-1] + 1 = 1 + 1 = 2</text>
  <text class="note" x="360" y="276" text-anchor="middle">两重循环 O(n·m) 填完整张表，右下角就是 LCS 长度；从右下角沿「来源箭头」往回走还能还原出子序列本身</text>
  <text class="note" x="360" y="302" text-anchor="middle">LIS 是它的「一维简化版」：只有一条序列、比较的是下标顺序而非字符相等</text>
</svg>
