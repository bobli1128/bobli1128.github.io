<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    text { font-size: 15px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .done { fill: #55aea6; }
    .done text { fill: #fff; }
    .note { fill: #999; font-size: 13px; }
    .step { fill: #3d8d86; font-weight: bold; font-size: 14px; }
  </style>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f5f5f5"/>

  <text x="360" y="40" text-anchor="middle" font-weight="bold">冒泡排序一趟：相邻比较，大的往后「冒」</text>

  <text class="step" x="60" y="85">排序前</text>
  <rect class="cell" x="200" y="60" width="70" height="46"/>
  <rect class="cell" x="290" y="60" width="70" height="46"/>
  <rect class="cell" x="380" y="60" width="70" height="46"/>
  <rect class="cell" x="470" y="60" width="70" height="46"/>
  <text x="235" y="90" text-anchor="middle">5</text>
  <text x="325" y="90" text-anchor="middle">3</text>
  <text x="415" y="90" text-anchor="middle">8</text>
  <text x="505" y="90" text-anchor="middle">2</text>

  <text class="step" x="60" y="185">一趟后</text>
  <rect class="cell" x="200" y="160" width="70" height="46"/>
  <rect class="cell" x="290" y="160" width="70" height="46"/>
  <rect class="cell" x="380" y="160" width="70" height="46"/>
  <rect class="done" x="470" y="160" width="70" height="46"/>
  <text x="235" y="190" text-anchor="middle">3</text>
  <text x="325" y="190" text-anchor="middle">2</text>
  <text x="415" y="190" text-anchor="middle">5</text>
  <text x="505" y="190" text-anchor="middle">8</text>

  <line x1="360" y1="118" x2="360" y2="148" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="note" x="360" y="140" text-anchor="middle">(5,3) 交换 → (5,8) 不换 → (8,2) 交换 → 8 到位</text>

  <text class="note" x="360" y="245" text-anchor="middle">绿色 = 已就位。n 个数最多需要 n-1 趟，每趟都比上一趟少比一次。</text>
  <text class="note" x="360" y="270" text-anchor="middle">一趟内比较次数：n-1 次；总比较次数约 n²/2 —— 这就是 O(n²) 的由来。</text>
</svg>
