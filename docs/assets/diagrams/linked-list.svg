<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .data { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .next { fill: #e0f2f0; stroke: #55aea6; stroke-width: 1.5; }
    .boxtext { text-anchor: middle; font-family: Consolas, monospace; font-size: 15px; }
    .flow { stroke: #666; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .note { fill: #999; font-size: 13px; }
    .hl { fill: #e67e22; font-weight: bold; font-size: 13px; }
  </style>
  <rect x="0" y="0" width="720" height="260" rx="10" fill="#f5f5f5"/>

  <text x="360" y="36" text-anchor="middle" font-weight="bold">链表：数据盒子 + 装着「下一个地址」的盒子</text>

  <rect class="data" x="110" y="80" width="100" height="46" rx="4"/>
  <rect class="next" x="210" y="80" width="46" height="46" rx="4"/>
  <text class="boxtext" x="160" y="109">7</text>
  <text class="boxtext" x="233" y="109">•</text>
  <text class="note" x="160" y="146" text-anchor="middle">数据域</text>

  <rect class="data" x="330" y="80" width="100" height="46" rx="4"/>
  <rect class="next" x="430" y="80" width="46" height="46" rx="4"/>
  <text class="boxtext" x="380" y="109">13</text>
  <text class="boxtext" x="453" y="109">•</text>
  <text class="note" x="380" y="146" text-anchor="middle">数据域</text>

  <rect class="data" x="550" y="80" width="100" height="46" rx="4"/>
  <rect class="next" x="650" y="80" width="46" height="46" rx="4"/>
  <text class="boxtext" x="600" y="109">5</text>
  <text class="boxtext" x="673" y="109">∅</text>
  <text class="note" x="600" y="146" text-anchor="middle">数据域</text>

  <line class="flow" x1="258" y1="103" x2="324" y2="103"/>
  <line class="flow" x1="478" y1="103" x2="544" y2="103"/>
  <text class="note" x="290" y="94" text-anchor="middle">next 指向</text>
  <text class="note" x="510" y="94" text-anchor="middle">next 指向</text>
  <text class="note" x="673" y="146" text-anchor="middle">空：到头了</text>

  <text class="hl" x="360" y="196" text-anchor="middle">在 7 和 13 之间插入新节点：只需改 1 个 next 指针（数组则要挪动整片元素）</text>
  <text class="note" x="360" y="226" text-anchor="middle">数组：连续房间，随机访问 O(1)，插删 O(n)　|　链表：散落盒子，插删 O(1)，按位访问 O(n)</text>
</svg>
