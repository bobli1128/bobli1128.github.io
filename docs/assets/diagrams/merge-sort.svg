<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.4; }
    .cell text { text-anchor: middle; font-family: Consolas, monospace; font-size: 14px; }
    .half { fill: #e0f2f0; stroke: #3d8d86; stroke-width: 1.4; }
    .half text { text-anchor: middle; font-family: Consolas, monospace; font-size: 14px; }
    .line { stroke: #666; stroke-width: 1.3; marker-end: url(#arr); }
    .note { fill: #999; font-size: 13px; }
    .lbl { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
    .inv { fill: #e67e22; font-size: 13px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="320" rx="10" fill="#f5f5f5"/>

  <text x="360" y="32" text-anchor="middle" font-weight="bold">归并排序：分 → 治 → 合（顺便数出逆序对）</text>

  <text class="lbl" x="90" y="62">分解</text>
  <rect class="cell" x="150" y="45" width="420" height="32"/>
  <text x="360" y="66">5   3   8   2</text>

  <line class="line" x1="230" y1="80" x2="230" y2="98"/>
  <line class="line" x1="490" y1="80" x2="490" y2="98"/>

  <rect class="half" x="150" y="100" width="200" height="32"/>
  <text x="250" y="121">5 3</text>
  <rect class="half" x="370" y="100" width="200" height="32"/>
  <text x="470" y="121">8 2</text>

  <text class="lbl" x="90" y="172">子问题</text>
  <rect class="half" x="150" y="155" width="90" height="32"/>
  <text x="195" y="176">3 5</text>
  <rect class="half" x="260" y="155" width="90" height="32"/>
  <text x="305" y="176">有序!</text>
  <rect class="half" x="370" y="155" width="90" height="32"/>
  <text x="415" y="176">2 8</text>
  <rect class="half" x="480" y="155" width="90" height="32"/>
  <text x="525" y="176">有序!</text>

  <line class="line" x1="360" y1="195" x2="360" y2="215"/>

  <text class="lbl" x="90" y="245">合并</text>
  <rect class="cell" x="150" y="228" width="420" height="32"/>
  <text x="360" y="249">2   3   5   8</text>

  <text class="inv" x="600" y="121" text-anchor="middle">跨左右两半的逆序对：</text>
  <text class="inv" x="600" y="143" text-anchor="middle">3&gt;2 → 1 个 + 5&gt;2 → 2 个</text>
  <text class="note" x="600" y="165" text-anchor="middle">（左半剩 3,5 时弹出 2）</text>

  <text class="note" x="360" y="290" text-anchor="middle">逆序对总数 = 左半内部 + 右半内部 + 跨半部分（合并时顺路统计：右半出队一次，就加上「左半还没出队的个数」）</text>
  <text class="note" x="360" y="312" text-anchor="middle">递推 T(n) = 2T(n/2) + O(n) → O(n log n)：冒泡数逆序对是 O(n²)，这就是分治的力量</text>
</svg>
