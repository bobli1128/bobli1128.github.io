<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e67e22"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .cell text { text-anchor: middle; font-family: Consolas, monospace; font-size: 15px; }
    .pal { fill: #e0f2f0; stroke: #3d8d86; stroke-width: 1.5; }
    .idx { fill: #999; font-size: 12.5px; }
    .flow { stroke: #e67e22; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .note { fill: #999; font-size: 13px; }
    .lbl { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f5f5f5"/>

  <text x="360" y="32" text-anchor="middle" font-weight="bold">回文中心扩展：从中间向两边「镜像检查」</text>

  <g>
    <rect class="cell" x="100" y="60" width="60" height="46"/>
    <text x="130" y="88">a</text>
    <rect class="cell" x="160" y="60" width="60" height="46"/>
    <text x="190" y="88">b</text>
    <rect class="pal" x="220" y="60" width="60" height="46"/>
    <text x="250" y="88">c</text>
    <rect class="pal" x="280" y="60" width="60" height="46"/>
    <text x="310" y="88">b</text>
    <rect class="pal" x="340" y="60" width="60" height="46"/>
    <text x="370" y="88">c</text>
    <rect class="cell" x="400" y="60" width="60" height="46"/>
    <text x="430" y="88">b</text>
    <rect class="cell" x="460" y="60" width="60" height="46"/>
    <text x="490" y="88">d</text>
    <rect class="cell" x="520" y="60" width="60" height="46"/>
    <text x="550" y="88">e</text>
    <text class="idx" x="130" y="122" text-anchor="middle">0</text>
    <text class="idx" x="190" y="122" text-anchor="middle">1</text>
    <text class="idx" x="250" y="122" text-anchor="middle">2</text>
    <text class="idx" x="310" y="122" text-anchor="middle">3</text>
    <text class="idx" x="370" y="122" text-anchor="middle">4</text>
    <text class="idx" x="430" y="122" text-anchor="middle">5</text>
    <text class="idx" x="490" y="122" text-anchor="middle">6</text>
    <text class="idx" x="550" y="122" text-anchor="middle">7</text>
  </g>

  <path class="flow" d="M 310 130 C 310 165 250 165 250 165"/>
  <path class="flow" d="M 310 130 C 310 165 370 165 370 165"/>
  <text class="lbl" x="360" y="185" text-anchor="middle">中心 3/4 之间（偶回文）：cb → bcb → cbcbc，扩到最大半径</text>

  <text class="note" x="360" y="228" text-anchor="middle">朴素中心扩展：n 个中心 × O(n) 扩展 = O(n²)，简单可靠，n ≤ 10⁴ 随便过</text>
  <text class="note" x="360" y="256" text-anchor="middle">Manacher 的洞察：每个回文是「镜像对称」的 —— 大回文内部的小回文，半径信息可以从镜像直接抄过来</text>
  <text class="note" x="360" y="282" text-anchor="middle">先「插 #」统一奇偶（abc → #a#b#c#），再用半径数组 r[] 线性推进 —— O(n) 求全串最长回文</text>
</svg>
