<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e67e22"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .code { font-family: Consolas, monospace; font-size: 14.5px; }
    .step { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
    .hl { fill: #e67e22; font-weight: bold; }
    .flow { stroke: #e67e22; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    .note { fill: #999; font-size: 13px; }
    .box { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
  </style>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f5f5f5"/>

  <text x="360" y="32" text-anchor="middle" font-weight="bold">exgcd 求逆元：一层递归，答案从最深处逐层「回传配方」</text>

  <g>
    <rect class="box" x="80" y="55" width="560" height="34" rx="6"/>
    <text class="code" x="360" y="78" text-anchor="middle">求 3x ≡ 1 (mod 10)　⇔　3x − 10k = 1　⇔　exgcd(3, 10, x, k)</text>
  </g>

  <text class="step" x="90" y="128">① gcd 递归</text>
  <text class="code" x="90" y="152">gcd(3,10) → gcd(10%3=1, 3) → gcd(3%1=0, 1) → 停！(b=0)</text>

  <text class="step" x="90" y="196">② 回传配方</text>
  <text class="code" x="90" y="220">b=0 时:  x=1, y=0</text>
  <text class="code" x="90" y="244">上一层:  x = y' = 0,  y = x' − (a/b)·y' = 1 − 0 = 1</text>
  <text class="code" x="90" y="268">再上层:  x = 1, y = 0 − 3×1 = <tspan class="hl">−3</tspan>　→　3×(−3) − 10×(−1) = 1 ✓</text>

  <line class="flow" x1="640" y1="196" x2="640" y2="120"/>
  <text class="note" x="706" y="160" text-anchor="end">逆元 = x mod 10 = (−3+10) mod 10 = 7</text>
  <text class="note" x="360" y="292" text-anchor="middle">验证：3 × 7 = 21 = 2×10 + 1 ≡ 1 (mod 10) ✓　—— 「除以 3」从此变成「乘 7」</text>
</svg>
