<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .cell text { text-anchor: middle; font-family: Consolas, monospace; font-size: 15px; }
    .head { fill: #e0f2f0; stroke: #3d8d86; stroke-width: 1.5; }
    .head text { text-anchor: middle; font-size: 13px; }
    .new { fill: #ffe9c9; stroke: #e67e22; stroke-width: 2; }
    .note { fill: #999; font-size: 13px; }
    .lbl { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="330" rx="10" fill="#f5f5f5"/>

  <text x="360" y="34" text-anchor="middle" font-weight="bold">01 背包填表：f[i][j] = 前 i 件物品、容量 j 时的最大价值</text>

  <rect class="head" x="120" y="60" width="80" height="40"/>
  <text x="160" y="85">容量 j→</text>
  <rect class="head" x="200" y="60" width="70" height="40"/>
  <text x="235" y="85">0</text>
  <rect class="head" x="270" y="60" width="70" height="40"/>
  <text x="305" y="85">1</text>
  <rect class="head" x="340" y="60" width="70" height="40"/>
  <text x="375" y="85">2</text>
  <rect class="head" x="410" y="60" width="70" height="40"/>
  <text x="445" y="85">3</text>
  <rect class="head" x="480" y="60" width="70" height="40"/>
  <text x="515" y="85">4</text>

  <rect class="head" x="120" y="100" width="80" height="40"/>
  <text x="160" y="125">物品1 (w1,v1)</text>
  <rect class="cell" x="200" y="100" width="70" height="40"/>
  <text x="235" y="125">0</text>
  <rect class="cell" x="270" y="100" width="70" height="40"/>
  <text x="305" y="125">0</text>
  <rect class="cell" x="340" y="100" width="70" height="40"/>
  <text x="375" y="125">0</text>
  <rect class="cell" x="410" y="100" width="70" height="40"/>
  <text x="445" y="125">0</text>
  <rect class="cell" x="480" y="100" width="70" height="40"/>
  <text x="515" y="125">0</text>

  <rect class="head" x="120" y="140" width="80" height="40"/>
  <text x="160" y="165">物品2 (w2,v2)</text>
  <rect class="cell" x="200" y="140" width="70" height="40"/>
  <text x="235" y="165">0</text>
  <rect class="cell" x="270" y="140" width="70" height="40"/>
  <text x="305" y="165">0</text>
  <rect class="cell" x="340" y="140" width="70" height="40"/>
  <text x="375" y="165">0</text>
  <rect class="cell" x="410" y="140" width="70" height="40"/>
  <text x="445" y="165">0</text>
  <rect class="new" x="480" y="140" width="70" height="40"/>
  <text x="515" y="165">?</text>

  <rect class="head" x="120" y="180" width="80" height="40"/>
  <text x="160" y="205">物品3 (w3,v3)</text>
  <rect class="cell" x="200" y="180" width="70" height="40" opacity="0.4"/>
  <rect class="cell" x="270" y="180" width="70" height="40" opacity="0.4"/>
  <rect class="cell" x="340" y="180" width="70" height="40" opacity="0.4"/>
  <rect class="cell" x="410" y="180" width="70" height="40" opacity="0.4"/>
  <rect class="cell" x="480" y="180" width="70" height="40" opacity="0.4"/>

  <text class="lbl" x="706" y="165" text-anchor="end">正在填这一格</text>
  <text class="note" x="706" y="188" text-anchor="end">只依赖上一行：放 or 不放</text>

  <text class="note" x="360" y="262" text-anchor="middle">不放第 i 件：f[i][j] = f[i-1][j]　　放得下就试一件：f[i][j] = max(f[i-1][j], f[i-1][j-wᵢ] + vᵢ)</text>
  <text class="note" x="360" y="290" text-anchor="middle">从上到下、从左到右逐格填——每个格子只问上一行要答案，这就是「无后效性」。</text>
</svg>
