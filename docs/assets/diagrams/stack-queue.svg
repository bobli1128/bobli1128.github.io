<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .cell { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .cell text { text-anchor: middle; font-family: Consolas, monospace; font-size: 16px; }
    .title { font-size: 17px; font-weight: bold; fill: #3d8d86; }
    .flow { stroke: #666; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    .lbl { fill: #3d8d86; font-size: 13.5px; font-weight: bold; }
    .note { fill: #999; font-size: 13px; }
  </style>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f5f5f5"/>

  <text class="title" x="170" y="45" text-anchor="middle">栈（叠盘子）</text>
  <rect class="cell" x="125" y="85" width="90" height="44" rx="4"/>
  <rect class="cell" x="125" y="135" width="90" height="44" rx="4"/>
  <rect class="cell" x="125" y="185" width="90" height="44" rx="4"/>
  <text x="170" y="113">3</text>
  <text x="170" y="163">2</text>
  <text x="170" y="213">1</text>
  <text class="lbl" x="170" y="78" text-anchor="middle">← 栈顶：唯一入口</text>
  <line class="flow" x1="250" y1="105" x2="222" y2="105"/>
  <text class="note" x="258" y="110">入栈 push</text>
  <line class="flow" x1="222" y1="105" x2="250" y2="105" transform="translate(0,42)"/>
  <text class="note" x="258" y="152">出栈 pop（也是顶）</text>
  <text class="note" x="170" y="258" text-anchor="middle">后进先出 LIFO：最后放的先拿</text>

  <text class="title" x="530" y="45" text-anchor="middle">队列（排队打饭）</text>
  <rect class="cell" x="410" y="130" width="70" height="44" rx="4"/>
  <rect class="cell" x="490" y="130" width="70" height="44" rx="4"/>
  <rect class="cell" x="570" y="130" width="70" height="44" rx="4"/>
  <text x="445" y="158">1</text>
  <text x="525" y="158">2</text>
  <text x="605" y="158">3</text>
  <line class="flow" x1="392" y1="152" x2="404" y2="152"/>
  <text class="lbl" x="445" y="115" text-anchor="middle">队首：出队 pop_front</text>
  <line class="flow" x1="660" y1="152" x2="646" y2="152"/>
  <text class="lbl" x="605" y="205" text-anchor="middle">队尾：入队 push_back</text>
  <text class="note" x="530" y="258" text-anchor="middle">先进先出 FIFO：先来的先走</text>
</svg>
