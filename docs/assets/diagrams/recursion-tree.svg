<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <style>
    text { font-size: 14px; fill: #1d1d20; }
    .node { fill: #fff; stroke: #55aea6; stroke-width: 1.5; }
    .node text { text-anchor: middle; font-family: Consolas, monospace; font-size: 14px; }
    .dup { fill: #fff7ed; stroke: #e67e22; stroke-width: 2; }
    .leaf { fill: #e0f2f0; stroke: #3d8d86; stroke-width: 1.5; }
    .leaf text { text-anchor: middle; font-family: Consolas, monospace; font-size: 14px; }
    .line { stroke: #999; stroke-width: 1.3; }
    .note { fill: #999; font-size: 13px; }
    .warn { fill: #e67e22; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="720" height="400" rx="10" fill="#f5f5f5"/>

  <text x="360" y="32" text-anchor="middle" font-weight="bold">fib(4) 的递归调用树</text>

  <rect class="node" x="320" y="48" width="80" height="34" rx="6"/>
  <text x="360" y="70">fib(4)</text>

  <line class="line" x1="340" y1="82" x2="270" y2="118"/>
  <line class="line" x1="380" y1="82" x2="490" y2="118"/>

  <rect class="node" x="210" y="120" width="80" height="34" rx="6"/>
  <text x="250" y="142">fib(3)</text>
  <rect class="dup" x="470" y="120" width="80" height="34" rx="6"/>
  <text x="510" y="142">fib(2)</text>

  <line class="line" x1="230" y1="154" x2="190" y2="190"/>
  <line class="line" x1="270" y1="154" x2="310" y2="190"/>
  <line class="line" x1="490" y1="154" x2="450" y2="190"/>
  <line class="line" x1="530" y1="154" x2="570" y2="190"/>

  <rect class="dup" x="130" y="192" width="80" height="34" rx="6"/>
  <text x="170" y="214">fib(2)</text>
  <rect class="leaf" x="290" y="192" width="80" height="34" rx="6"/>
  <text x="330" y="214">fib(1)=1</text>
  <rect class="leaf" x="410" y="192" width="80" height="34" rx="6"/>
  <text x="450" y="214">fib(1)=1</text>
  <rect class="leaf" x="530" y="192" width="80" height="34" rx="6"/>
  <text x="570" y="214">fib(0)=0</text>

  <line class="line" x1="150" y1="226" x2="115" y2="262"/>
  <line class="line" x1="190" y1="226" x2="225" y2="262"/>

  <rect class="leaf" x="70" y="264" width="80" height="34" rx="6"/>
  <text x="110" y="286">fib(1)=1</text>
  <rect class="leaf" x="190" y="264" width="80" height="34" rx="6"/>
  <text x="230" y="286">fib(0)=0</text>

  <text class="warn" x="360" y="340" text-anchor="middle">橙色节点：fib(2) 被完整计算了两遍，fib(1) 算了三遍！</text>
  <text class="note" x="360" y="366" text-anchor="middle">n 越大重复越多（指数级增长）——这正是「递归慢」的原因，解法见本章第 3 课。</text>
</svg>
