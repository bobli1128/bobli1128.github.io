site_name: 我的文档站
site_url: https://bobli1128.github.io/
site_description: bobli1128 的个人静态文档网站
repo_url: https://github.com/bobli1128/bobli1128.github.io
edit_uri: edit/master/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到亮色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

# mathjax.js 必须列在 MathJax CDN 脚本之前（先写入 window.MathJax 配置）
# katex.js 是另一套公式渲染备选方案（KaTeX），与 MathJax 二选一，当前未启用
extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
  - javascripts/starfield.js
  - javascripts/starfield-init.js

extra:
  generator: false  # 隐藏页脚 "Made with Material for MkDocs"

nav:
  - 首页: index.md
  - 使用指南:
      - guide/index.md
      - 写作示例: guide/markdown-demo.md
  - 关于: about.md
