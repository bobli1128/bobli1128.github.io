site_name: Bobli 信奥课堂
site_url: https://bobli1128.github.io/
site_description: 写给四年级到初三同学的 C++ 信息学奥赛教程，覆盖 CSP-J（入门级）与 CSP-S（提高级）
repo_url: https://github.com/bobli1128/bobli1128.github.io
edit_uri: edit/master/docs/

theme:
  name: material
  language: zh
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到亮色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

# mathjax.js 必须列在 MathJax CDN 脚本之前（先写入 window.MathJax 配置）
# katex.js 是另一套公式渲染备选方案（KaTeX），与 MathJax 二选一，当前未启用
extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
  - javascripts/starfield.js
  - javascripts/starfield-init.js

extra:
  generator: false  # 隐藏页脚 "Made with Material for MkDocs"

nav:
  - 首页: index.md
  - 第一部分 · CSP-J 入门篇:
      - 第 0 章 · 走进编程:
          - start/index.md
          - 认识信息学奥赛与 CSP: start/what-is-csp.md
          - 搭建开发环境: start/environment.md
          - 第一个 C++ 程序: start/hello-world.md
      - 第 1 章 · C++ 语法基础:
          - basics/index.md
          - 变量与数据类型: basics/variable.md
          - 输入与输出: basics/io.md
          - 运算符与表达式: basics/operator.md
      - 第 2 章 · 分支与循环:
          - control/index.md
          - if 分支结构: control/if.md
          - for 与 while 循环: control/loop.md
      - 第 3 章 · 数组与字符串:
          - array/index.md
          - 一维数组与桶计数: array/1d-array.md
          - 排序：冒泡与选择: array/sort.md
          - 二维数组与字符串: array/2d-string.md
      - 第 4 章 · 函数与递归:
          - function/index.md
          - 函数的定义与调用: function/function.md
          - 递归入门: function/recursion.md
          - 递推: function/recurrence.md
      - 第 5 章 · 基础算法:
          - algo/index.md
          - 枚举：一个不漏地试: algo/enumerate.md
          - 模拟：把题目翻译成代码: algo/simulate.md
          - 贪心：每步都选当前最好: algo/greedy.md
          - 二分查找与二分答案: algo/binary-search.md
      - 第 6 章 · 简单数据结构:
          - ds/index.md
          - 结构体：把相关数据打包: ds/struct.md
          - 栈与队列: ds/stack-queue.md
          - 链表: ds/linked-list.md
      - 第 7 章 · 搜索入门:
          - search/index.md
          - DFS：一条道走到黑: search/dfs.md
          - BFS：层层扩散的水波: search/bfs.md
          - 剪枝：让搜索跑得更快: search/prune.md
      - 第 8 章 · 动态规划入门:
          - dp/index.md
          - 一维动态规划: dp/dp1d.md
          - 背包问题: dp/knapsack.md
      - 第 9 章 · 竞赛数学基础:
          - math/index.md
          - 进制与位运算: math/base-bits.md
          - 质数与公约数: math/primes-gcd.md
          - 简单计数与排列组合: math/counting.md
  - 第二部分 · CSP-S 提高篇:
      - 第 10 章 · 数据结构进阶:
          - adv-ds/index.md
      - 第 11 章 · 树与图论:
          - graph/index.md
      - 第 12 章 · 动态规划进阶:
          - adv-dp/index.md
      - 第 13 章 · 字符串算法:
          - stralgo/index.md
      - 第 14 章 · 搜索与优化进阶:
          - adv-search/index.md
      - 第 15 章 · 竞赛数学进阶:
          - adv-math/index.md
  - 备赛指南:
      - contest/index.md
  - 关于本站:
      - about.md
